[project]
name = "grid-pulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  # Airflow
  "apache-airflow>=3.2.0",
  "apache-airflow-providers-fab",
  # PostgreSQL
  "psycopg2-binary",
  "apache-airflow-providers-postgres",
  # GridPulse application
  "httpx>=0.27.0",
  "tenacity>=8.2.3",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "pyyaml>=6.0.1",
  "lxml>=5.1.0",
  "entsoe-py>=0.8.1",
  "minio>=7.2.20",
  "pyarrow>=23.0.1",
  "sqlalchemy>=2.0.48",
  "dbt-core>=1.12.7",
  "dbt-postgres>=1.11.0",
]

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.2.0", "ruff>=0.17.3"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse"]
