version: 2

models:
  - name: mrt_supply_demand_balance
    description: "Hourly generation vs load balance per bidding zone."
    columns:
      - name: country_code
        tests: [not_null]
      - name: hour_utc
        tests: [not_null]
      - name: balance_status
        tests:
          - accepted_values:
              arguments:
                values: ["surplus", "deficit", "balanced"]

  - name: mrt_generation_mix
    description: "Daily generation mix per fuel type with share of total."
    columns:
      - name: country_code
        tests: [not_null]
      - name: date_utc
        tests: [not_null]
      - name: psr_code
        tests: [not_null]

  - name: mrt_renewable_penetration
    description: "Hourly renewable generation as a percentage of load."
    columns:
      - name: country_code
        tests: [not_null]
      - name: hour_utc
        tests: [not_null]

  - name: mrt_cross_border_net_flows
    description: "Daily net cross-border flow position per zone."
    columns:
      - name: country_code
        tests: [not_null]
      - name: date_utc
        tests: [not_null]
      - name: net_position
        tests:
          - accepted_values:
              arguments:
                values: ["net_exporter", "net_importer", "balanced"]

  - name: mrt_price_analytics
    description: "Daily day-ahead price statistics per bidding zone."
    columns:
      - name: country_code
        tests: [not_null]
      - name: date_utc
        tests: [not_null]
      - name: avg_price_eur_mwh
        tests: [not_null]
