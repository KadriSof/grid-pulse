name: "gridpulse"
version: "1.0.0"
config-version: 2

profile: "gridpulse"

# Path configurations
model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  gridpulse:
    staging:
      +materialized: view
      +schema: staging # Creates a 'public_staging' schema
    marts:
      +materialized: table
      +schema: marts # Creates a 'public_marts' schema
